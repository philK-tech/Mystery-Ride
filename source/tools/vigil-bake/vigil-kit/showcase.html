<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vigil Kit Testseite</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c; color: #d8c8a8; font: 13px Georgia, serif; }
    #info { position: fixed; left: 12px; top: 10px; background: rgba(10, 9, 14, .8); padding: 6px 10px; border: 1px solid #5c4326; border-radius: 4px; }
    #err { position: fixed; left: 12px; right: 12px; top: 50px; display: none; background: #6e1212; color: #fee; padding: 10px; font: 12px monospace; white-space: pre-wrap; }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <div id="info">Vigil Kit: Held und Monster mit den echten Modulen. Ziehen zum Drehen. Klick: nächste Animation.</div>
  <div id="err"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VigilStandaloneFactory } from './VigilAssets.js';

    const err = document.getElementById('err');
    const fail = (e) => { err.style.display = 'block'; err.textContent += (e?.stack || e) + '\n'; console.error(e); };
    window.addEventListener('error', (e) => fail(e.error || e.message));
    window.addEventListener('unhandledrejection', (e) => fail(e.reason));

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07080c);
    scene.fog = new THREE.FogExp2(0x07080c, 0.03);
    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
    const q = new URLSearchParams(location.search);
    const only = q.get('only');
    const big = only === 'boss' || only === 'brute';
    camera.position.set(0, big ? 3.2 : 1.6, only ? (big ? 8.5 : 3.6) : 17);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, only === 'boss' ? 2.4 : only ? 0.9 : 1.6, 0);

    // Licht: kaltes Grundlicht, warme Fackeln, ein Führungslicht von vorn oben
    scene.add(new THREE.AmbientLight(0x3a4560, 1.6));
    const key = new THREE.SpotLight(0xffd6a8, 260, 50, 0.9, 0.5, 1.2);
    key.position.set(2, 8, 8); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
    scene.add(key, key.target);
    const rim = new THREE.DirectionalLight(0x6f88bc, 0.9); rim.position.set(-4, 5, -6); scene.add(rim);

    const t0 = performance.now();
    const vigil = new VigilStandaloneFactory(renderer, scene, { tier: q.get('tier') || 'low' });

    // Boden und ein paar Verliesteile aus dem Kit
    const mats = vigil.createDungeonMaterials();
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 14).rotateX(-Math.PI / 2), mats.floor);
    floor.receiveShadow = true; scene.add(floor);
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 7), mats.stone);
    wall.position.set(0, 3.5, -4); wall.receiveShadow = true; scene.add(wall);
    const kitPieces = [];
    const placePiece = (fn, x, z, ry = 0) => {
      try {
        const g = vigil.buildPieceGroup(fn());
        g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g); kitPieces.push(g);
      } catch (e) { console.warn('Kit-Teil fehlgeschlagen', e); }
    };
    if (!only) {
      placePiece(() => vigil.kit.column(0), -9, -3);
      placePiece(() => vigil.kit.column(1), 9, -3);
      placePiece(() => vigil.kit.sarcophagus(0), -6, -3, 0.2);
      placePiece(() => vigil.kit.brazier(0), 6, -3);
      placePiece(() => vigil.kit.bones(0), 3, -2.5);
      placePiece(() => vigil.kit.rubble(0, 1), -3, -2.8);
    }

    // Figuren
    const names = only ? [only] : ['hero', 'skeleton', 'ghoul', 'cultist', 'hellhound', 'brute', 'wraith', 'boss'];
    const actors = [];
    names.forEach((n, i) => {
      try {
        const a = n === 'hero' ? vigil.createHero() : vigil.createCreature(n);
        const x = names.length === 1 ? 0 : (i - (names.length - 1) / 2) * 2.4;
        a.root.position.set(names.length === 1 ? 0 : (n === 'boss' ? 0 : x), 0, names.length > 1 && n === 'boss' ? -3.0 : 0);
        if (names.length > 1 && n === 'boss') a.root.position.x = 0;
        a.name = n;
        a.list = n === 'hero' ? ['attack1', 'attack2', 'attack3', 'heavy', 'cast'] : a.clipNames.filter((c) => c !== 'death');
        a.k = 0;
        scene.add(a.root);
        actors.push(a);
        a.root.traverse((o) => { if (o.isMesh) o.castShadow = true; });
      } catch (e) { fail(`${n}: ${e?.stack || e}`); }
    });
    console.log(`[showcase] ${actors.length} Figuren in ${(performance.now() - t0).toFixed(0)} ms gebaut`);

    // Klick spielt bei allen den nächsten Clip
    renderer.domElement.addEventListener('dblclick', () => {
      for (const a of actors) { a.k = (a.k + 1) % a.list.length; a.play(a.list[a.k]); }
    });
    // Testhilfe: ?clip=roar spielt sofort diesen Clip, ?gait=1 lässt den Helden gehen
    if (q.get('clip')) for (const a of actors) if (a.list.includes(q.get('clip')) || a.name === 'hero') a.play(q.get('clip'));
    for (const a of actors) if (a.name === 'hero' && q.get('gait')) a.setGait(+q.get('gait'));

    const clock = new THREE.Clock();
    let elapsed = 0;
    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      elapsed += dt;
      vigil.tick(dt, elapsed);
      for (const a of actors) a.update(dt, elapsed);
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    frame();
    window.__ready = true;
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
